name: Validate and package DoctorCura UI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build plugin ZIP
        run: |
          mkdir -p build/doctorcura-ui
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/doctorcura-ui/
          cd build
          zip -qr doctorcura-ui.zip doctorcura-ui
          unzip -t doctorcura-ui.zip
      - uses: actions/upload-artifact@v4
        with:
          name: doctorcura-ui
          path: build/doctorcura-ui.zip
          if-no-files-found: error
