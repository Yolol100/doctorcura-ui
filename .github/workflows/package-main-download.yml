name: Package DoctorCura UI main

on:
  push:
    paths:
      - '.github/workflows/package-main-download.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Build plugin ZIP
        run: |
          mkdir -p build/doctorcura-ui
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/doctorcura-ui/
          cd build
          zip -qr doctorcura-ui-1.3.2.zip doctorcura-ui
      - uses: actions/upload-artifact@v4
        with:
          name: doctorcura-ui-1.3.2
          path: build/doctorcura-ui-1.3.2.zip
          if-no-files-found: error
